<div class="min-h-screen bg-stone-100 dark:bg-neutral-900 text-stone-800 dark:text-stone-200 font-sans">

  <header class="flex items-center justify-between px-8 py-5 border-b border-stone-200 dark:border-neutral-800">
    <div class="flex items-center gap-3">
      <button (click)="cancel()"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-stone-200 dark:border-neutral-700 text-stone-500 hover:bg-stone-100 dark:hover:bg-neutral-800 cursor-pointer transition-colors text-sm">
        &larr; Volver
      </button>
      <span class="text-amber-500 text-xl">&#9670;</span>
      <span class="text-lg font-semibold tracking-widest">{{ appName }}</span>
    </div>
    <h2 class="text-sm font-medium text-stone-500">{{ isEdit() ? 'Editar' : 'Nuevo' }} Profesor</h2>
  </header>

  <main class="max-w-lg mx-auto px-8 py-10">

    @if (loading()) {
      <div class="text-center py-20 text-stone-400">Cargando...</div>
    } @else {
      <div class="bg-white dark:bg-neutral-800 border border-stone-200 dark:border-neutral-700 rounded-2xl p-8">

        <h1 class="text-2xl font-semibold tracking-tight mb-6">{{ isEdit() ? 'Editar Profesor' : 'Nuevo Profesor' }}</h1>

        @if (error()) {
          <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-500 dark:text-red-400 text-sm px-4 py-3 rounded-xl mb-6">{{ error() }}</div>
        }

        <form class="flex flex-col gap-5" (ngSubmit)="submit()">

          <div class="flex flex-col gap-2">
            <label class="text-xs font-medium tracking-widest uppercase text-stone-400">Nombre</label>
            <input type="text" placeholder="Nombre" [value]="name()"
              (input)="name.set($any($event.target).value)"
              class="w-full bg-stone-50 dark:bg-neutral-900 border border-stone-200 dark:border-neutral-700 rounded-xl px-4 py-3 text-sm outline-none transition-all duration-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 dark:focus:ring-amber-900/30" />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-xs font-medium tracking-widest uppercase text-stone-400">Apellido</label>
            <input type="text" placeholder="Apellido" [value]="surname()"
              (input)="surname.set($any($event.target).value)"
              class="w-full bg-stone-50 dark:bg-neutral-900 border border-stone-200 dark:border-neutral-700 rounded-xl px-4 py-3 text-sm outline-none transition-all duration-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 dark:focus:ring-amber-900/30" />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-xs font-medium tracking-widest uppercase text-stone-400">Email</label>
            <input type="email" placeholder="correo@ejemplo.com" [value]="email()"
              (input)="email.set($any($event.target).value)"
              [disabled]="isEdit()"
              class="w-full bg-stone-50 dark:bg-neutral-900 border border-stone-200 dark:border-neutral-700 rounded-xl px-4 py-3 text-sm outline-none transition-all duration-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 dark:focus:ring-amber-900/30 disabled:opacity-50 disabled:cursor-not-allowed" />
            @if (isEdit()) {
              <p class="text-xs text-stone-400 mt-1">El email no se puede modificar.</p>
            }
          </div>

          <div class="flex gap-3 mt-2">
            <button type="button" (click)="cancel()"
              class="flex-1 py-3 rounded-xl text-sm font-medium border border-stone-300 dark:border-neutral-700 text-stone-500 dark:text-stone-400 bg-transparent cursor-pointer hover:bg-stone-100 dark:hover:bg-neutral-800 transition-colors">
              Cancelar
            </button>
            <button type="submit" [disabled]="saving() || !name().trim() || !surname().trim() || !email().trim()"
              class="flex-1 py-3 rounded-xl text-sm font-medium border-none cursor-pointer text-white bg-amber-500 hover:bg-amber-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
              @if (!saving()) {
                <span>{{ isEdit() ? 'Guardar Cambios' : 'Crear Profesor' }}</span>
              } @else {
                <span class="inline-block w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              }
            </button>
          </div>

        </form>
      </div>
    }

  </main>

</div>
